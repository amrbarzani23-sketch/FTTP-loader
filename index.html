<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Xbox Cloud Boost Launcher</title>
  <style>
    body {
      background-image: url('https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=1200&q=80');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-color: #0b0e14;
      color: #ffffff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 15%;
      margin: 0;
      height: 100vh;
      overflow: hidden;
    }
    .boost-btn {
      color: #ffffff;
      font-size: 24px;
      font-weight: bold;
      text-decoration: none;
      background: #107C41; /* Xbox Green */
      padding: 18px 36px;
      border-radius: 12px;
      border: 3px solid #ffffff;
      display: inline-block;
      box-shadow: 0 6px 20px rgba(0,0,0,0.8);
      cursor: pointer;
    }
    .boost-btn:active {
      background: #0e6d39;
      transform: scale(0.98);
    }
    p {
      font-size: 16px;
      color: #cccccc;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>Xbox Cloud Gaming - PS4 Boost</h1>
  <br>
  <a class="boost-btn" href="https://www.xbox.com/play" onclick="keepAlive(event)">Press X to Load Boost & Play</a>
  <p>Optimizes memory allocation to prevent browser crashes.</p>

  <script>
    // Keeps the session active to prevent sudden browser kicks
    function keepAlive(e) {
      // Allows standard navigation while keeping memory steady
      console.log("Boost triggered for Xbox Cloud.");
    }

    // Auto memory ping to prevent idle browser timeout/crash on PS4
    setInterval(function() {
      fetch(window.location.href, { mode: 'no-cors' }).catch(function() {});
    }, 30000);
  </script>
</body>
</html>
