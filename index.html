<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>PSBox Cloud Gaming</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      /* Anime wallpaper preserved permanently */
      background: #000000 url('https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed;
      background-size: cover;
      font-family: Arial, sans-serif;
      color: white;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: 12vh;
    }

    .overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: 1;
    }

    .content {
      position: relative;
      z-index: 2;
      text-align: center;
    }

    h1 {
      font-size: 34px;
      margin-bottom: 5px;
      text-shadow: 0 3px 12px rgba(0,0,0,0.9);
      color: #ffffff;
    }

    p {
      color: #b19cd9;
      font-size: 15px;
      margin-bottom: 25px;
      text-shadow: 0 2px 6px rgba(0,0,0,0.9);
    }

    /* Green Launch Button */
    .boost-btn {
      background: #107C41;
      color: white;
      font-size: 22px;
      font-weight: bold;
      padding: 18px 45px;
      border: 3px solid #ffffff;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 0 30px rgba(16, 124, 65, 0.9);
      text-decoration: none;
      display: inline-block;
    }
    .boost-btn:focus, .boost-btn:hover {
      background: #0e6d39;
      transform: scale(1.05);
      outline: none;
    }

    /* Authentic White GoldHEN System Notification Banner */
    #ps4-notification {
      position: fixed;
      top: 40px;
      left: -450px; /* Start hidden off-screen */
      background: #ffffff;
      color: #000000;
      width: 370px;
      padding: 16px 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.85);
      z-index: 9999;
      display: flex;
      align-items: center;
      gap: 15px;
      border-radius: 2px;
      transition: left 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .notif-icon {
      background: #003791;
      color: white;
      font-weight: bold;
      font-size: 18px;
      width: 44px;
      height: 44px;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
      border-radius: 2px;
    }
    .notif-text h3 {
      margin: 0 0 3px 0;
      font-size: 15px;
      color: #111111;
      font-weight: bold;
    }
    .notif-text p {
      margin: 0;
      font-size: 13px;
      color: #555555;
    }
  </style>
</head>
<body>
  <div class="overlay"></div>

  <!-- GoldHEN System Style Notification -->
  <div id="ps4-notification">
    <div class="notif-icon">PS</div>
    <div class="notif-text">
      <h3>GoldHEN MS Boost Loaded</h3>
      <p>Target Latency: ~30ms Locked • Route Optimized</p>
    </div>
  </div>

  <div class="content">
    <h1>PSBox Cloud Gaming</h1>
    <p>30ms Low Latency MS Boost Mode</p>
    <button class="boost-btn" id="xBtn" onclick="runMsBoost()">Press X to Load MS Boost</button>
  </div>

  <script>
    // Automatically focus the button so pressing X works instantly on controller
    window.onload = function() {
      document.getElementById("xBtn").focus();
    };

    function runMsBoost() {
      var notif = document.getElementById("ps4-notification");
      
      // Slide GoldHEN notification out from the left
      notif.style.left = "20px";

      // Keep notification on screen for 3.5 seconds, then hide it without leaving the page!
      setTimeout(function() {
        notif.style.left = "-450px";
      }, 3500);
    }
  </script>
</body>
</html>
