<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PSBox Cloud Gaming & MS Boost</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: #000000;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #b19cd9;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    #galaxy-canvas {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: 0;
      background: radial-gradient(circle at center, #0f0524 0%, #030108 70%, #000000 100%);
    }

    .container {
      position: relative;
      z-index: 2;
      text-align: center;
      background: rgba(10, 5, 20, 0.85);
      border: 1px solid rgba(168, 85, 247, 0.5);
      padding: 35px 50px;
      border-radius: 14px;
      box-shadow: 0 0 35px rgba(168, 85, 247, 0.3);
    }

    #state {
      font-size: 24px;
      font-weight: bold;
      color: #22c55e;
      margin-bottom: 8px;
      text-shadow: 0 0 15px rgba(34, 197, 94, 0.6);
    }

    #ms-counter {
      font-size: 34px;
      font-weight: 800;
      color: #ffffff;
      margin: 12px 0;
      letter-spacing: 1px;
      text-shadow: 0 0 20px rgba(168, 85, 247, 0.8);
    }

    #out {
      font-size: 15px;
      color: #d8b4fe;
      margin-top: 5px;
    }

    /* Authentic GoldHEN Notification Banner */
    #ps4-notification {
      position: fixed;
      top: 35px;
      left: -480px;
      background: #ffffff;
      color: #000000;
      width: 370px;
      padding: 16px 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.85);
      z-index: 9999;
      display: flex;
      align-items: center;
      gap: 15px;
      border-radius: 3px;
      transition: left 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .notif-icon {
      background: #003791;
      color: white;
      font-weight: bold;
      font-size: 18px;
      width: 44px;
      height: 44px;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
      border-radius: 2px;
    }
    .notif-text h3 {
      margin: 0 0 3px 0;
      font-size: 15px;
      color: #111111;
      font-weight: bold;
    }
    .notif-text p {
      margin: 0;
      font-size: 13px;
      color: #555555;
    }
  </style>
</head>
<body>

  <canvas id="galaxy-canvas"></canvas>

  <div id="ps4-notification">
    <div class="notif-icon">PS</div>
    <div class="notif-text">
      <h3>GoldHEN MS Boost Active!</h3>
      <p>Target Route Stabilized (~32ms)</p>
    </div>
  </div>

  <div class="container">
    <div id="state">PSBox Cloud Gaming Hub</div>
    <div id="ms-counter">MS Boost: Initializing...</div>
    <div id="out">Optimizing local socket buffers</div>
  </div>

  <script>
    // Moving Galaxy & Network Wave Background
    const canvas = document.getElementById('galaxy-canvas');
    const ctx = canvas.getContext('2d');
    let stars = [];
    let pulseAngle = 0;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    for(let i=0; i<200; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: Math.random() * 1.8,
        alpha: Math.random(),
        speed: Math.random() * 0.03 + 0.01
      });
    }

    function drawGalaxy() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      pulseAngle += 0.03;
      let pulseAlpha = (Math.sin(pulseAngle) + 1) * 0.08 + 0.05;
      let grad = ctx.createRadialGradient(canvas.width/2, canvas.height/2, 50, canvas.width/2, canvas.height/2, canvas.width/1.5);
      grad.addColorStop(0, `rgba(34, 197, 94, ${pulseAlpha})`);
      grad.addColorStop(0.5, `rgba(168, 85, 247, ${pulseAlpha * 0.7})`);
      grad.addColorStop(1, 'transparent');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      stars.forEach(s => {
        s.alpha += s.speed;
        if(s.alpha > 1 || s.alpha < 0.2) s.speed = -s.speed;
        ctx.fillStyle = `rgba(255, 255, 255, ${Math.abs(s.alpha)})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.radius, 0, Math.PI*2);
        ctx.fill();
      });
      requestAnimationFrame(drawGalaxy);
    }
    drawGalaxy();

    // Run MS Boost Optimization Sequence immediately on load
    window.onload = function() {
      let currentPing = 118;
      let pingInterval = setInterval(function() {
        currentPing -= Math.floor(Math.random() * 14) + 8;
        if (currentPing <= 32) {
          currentPing = 32;
          clearInterval(pingInterval);
          document.getElementById('ms-counter').innerText = "MS Boost Locked: " + currentPing + "ms ⚡";
          document.getElementById('state').innerText = "PSBox Cloud Gaming Ready!";
          document.getElementById('out').innerText = "Launching Xbox Cloud Stream...";
          document.getElementById('ps4-notification').style.left = "20px";

          // Seamless redirect into Cloud Gaming after 3 seconds
          setTimeout(function() {
            window.location.href = "https://www.xbox.com/play";
          }, 3000);
        } else {
          document.getElementById('ms-counter').innerText = "Optimizing Ping: " + currentPing + "ms...";
        }
      }, 350);
    };
  </script>
</body>
</html>
