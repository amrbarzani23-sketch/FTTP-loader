<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PSBox Cloud Gaming</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: #000000;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: 12vh;
    }

    /* High-Detail Animated Moving Galaxy & Nebula Canvas */
    #galaxy-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      background: radial-gradient(circle at center, #180933 0%, #06020f 60%, #000000 100%);
    }

    .overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle, rgba(0,0,0,0.25) 0%, rgba(0,0,0,0.8) 100%);
      z-index: 1;
    }

    .content {
      position: relative;
      z-index: 2;
      text-align: center;
    }

    h1 {
      font-size: 38px;
      margin-bottom: 6px;
      text-shadow: 0 0 25px rgba(168, 85, 247, 0.8);
      color: #ffffff;
      letter-spacing: 1.2px;
      font-weight: 700;
    }

    #status-text {
      color: #d8b4fe;
      font-size: 15px;
      margin-bottom: 25px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.9);
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    /* Human-crafted Glowing Void Button */
    .boost-btn {
      background: linear-gradient(135deg, #7e22ce, #2563eb);
      color: white;
      font-size: 20px;
      font-weight: bold;
      padding: 16px 42px;
      border: 2px solid #e9d5ff;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 0 35px rgba(168, 85, 247, 0.7);
      outline: none;
      transition: all 0.25s ease;
    }
    .boost-btn:focus, .boost-btn:hover {
      background: linear-gradient(135deg, #9333ea, #3b82f6);
      border-color: #ffffff;
      transform: scale(1.05);
      box-shadow: 0 0 50px rgba(233, 213, 255, 0.9);
    }

    /* Authentic PlayStation / GoldHEN System Notification Banner */
    #ps4-notification {
      position: fixed;
      top: 40px;
      left: -480px;
      background: #ffffff;
      color: #000000;
      width: 370px;
      padding: 16px 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.85);
      z-index: 9999;
      display: flex;
      align-items: center;
      gap: 15px;
      border-radius: 3px;
      transition: left 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .notif-icon {
      background: #003791;
      color: white;
      font-weight: bold;
      font-size: 18px;
      width: 44px;
      height: 44px;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
      border-radius: 2px;
    }
    .notif-text h3 {
      margin: 0 0 3px 0;
      font-size: 15px;
      color: #111111;
      font-weight: bold;
    }
    .notif-text p {
      margin: 0;
      font-size: 13px;
      color: #555555;
    }
  </style>
</head>
<body>

  <!-- Animated Galaxy & Nebula Engine Canvas -->
  <canvas id="galaxy-canvas"></canvas>
  <div class="overlay"></div>

  <!-- GoldHEN Style Notification Banner -->
  <div id="ps4-notification">
    <div class="notif-icon">PS</div>
    <div class="notif-text">
      <h3 id="notif-title">GoldHEN MS Boost</h3>
      <p id="notif-desc">Target Latency: ~30ms Locked</p>
    </div>
  </div>

  <div class="content">
    <h1>PSBox Cloud Gaming</h1>
    <p id="status-text">Deep Space Void Stabilizer Ready</p>
    <button class="boost-btn" id="xBtn" onclick="triggerBoostAndLaunch()">Press X to Load MS Boost</button>
  </div>

  <script>
    // Advanced Procedural Moving Galaxy, Starfield & Nebula Animation
    const canvas = document.getElementById('galaxy-canvas');
    const ctx = canvas.getContext('2d');
    let stars = [];
    let nebulae = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Create dynamic star layers
    for (let i = 0; i < 250; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: Math.random() * 2,
        alpha: Math.random(),
        twinkleSpeed: Math.random() * 0.02 + 0.005
      });
    }

    // Create drifting nebula lighting clouds
    for (let i = 0; i < 20; i++) {
      nebulae.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: Math.random() * 220 + 120,
        color: i % 2 === 0 ? 'rgba(126, 34, 206, 0.07)' : 'rgba(37, 99, 235, 0.07)',
        vx: (Math.random() - 0.5) * 0.3,
        vy: (Math.random() - 0.5) * 0.3
      });
    }

    function renderGalaxy() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Render drifting nebulas
      nebulae.forEach(n => {
        n.x += n.vx;
        n.y += n.vy;
        if (n.x < -200) n.x = canvas.width + 200;
        if (n.x > canvas.width + 200) n.x = -200;
        if (n.y < -200) n.y = canvas.height + 200;
        if (n.y > canvas.height + 200) n.y = -200;

        let grad = ctx.createRadialGradient(n.x, n.y, 10, n.x, n.y, n.radius);
        grad.addColorStop(0, n.color);
        grad.addColorStop(1, 'transparent');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(n.x, n.y, n.radius, 0, Math.PI * 2);
        ctx.fill();
      });

      // Render glowing twinkling stars
      stars.forEach(star => {
        star.alpha += star.twinkleSpeed;
        if (star.alpha > 1 || star.alpha < 0.2) star.twinkleSpeed = -star.twinkleSpeed;

        ctx.fillStyle = `rgba(255, 255, 255, ${Math.abs(star.alpha)})`;
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
        ctx.fill();
      });

      requestAnimationFrame(renderGalaxy);
    }
    renderGalaxy();

    // Auto-focus button for instant controller 'X' support
    window.onload = function() {
      document.getElementById("xBtn").focus();
    };

    function triggerBoostAndLaunch() {
      var btn = document.getElementById("xBtn");
      var status = document.getElementById("status-text");
      var notif = document.getElementById("ps4-notification");
      var title = document.getElementById("notif-title");
      var desc = document.getElementById("notif-desc");

      btn.innerText = "Applying Route Patches...";
      status.innerText = "Optimizing socket buffers & initializing stream...";

      title.innerText = "GoldHEN MS Boost Loaded";
      desc.innerText = "Target Latency: ~30ms Locked • Launching Xbox Cloud";
      
      // Slide GoldHEN notification banner in smoothly
      notif.style.left = "20px";

      // Smoothly transition straight into Xbox Cloud Gaming after the notification displays
      setTimeout(function() {
        window.location.href = "https://www.xbox.com/play";
      }, 1600);
    }
  </script>
</body>
</html>
