<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>PSBox Cloud Gaming</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      /* Void Black Hole Theme */
      background: #000000 url('https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed;
      background-size: cover;
      font-family: Arial, sans-serif;
      color: white;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: 12vh;
    }

    .overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.85) 100%);
      z-index: 1;
    }

    .content {
      position: relative;
      z-index: 2;
      text-align: center;
    }

    h1 {
      font-size: 34px;
      margin-bottom: 5px;
      text-shadow: 0 0 15px rgba(255,255,255,0.4);
      color: #ffffff;
      letter-spacing: 1px;
    }

    #status-text {
      color: #9b51e0;
      font-size: 15px;
      margin-bottom: 25px;
      text-shadow: 0 2px 6px rgba(0,0,0,0.9);
      font-weight: bold;
    }

    /* Void Purple High-Performance Button */
    .boost-btn {
      background: #5b21b6;
      color: white;
      font-size: 22px;
      font-weight: bold;
      padding: 18px 45px;
      border: 3px solid #a855f7;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 0 35px rgba(168, 85, 247, 0.8);
      outline: none;
      transition: all 0.2s ease;
    }
    .boost-btn:focus, .boost-btn:hover {
      background: #7e22ce;
      border-color: #ffffff;
      transform: scale(1.05);
      box-shadow: 0 0 45px rgba(168, 85, 247, 1);
    }

    /* Authentic White GoldHEN System Notification Banner */
    #ps4-notification {
      position: fixed;
      top: 40px;
      left: -450px; /* Start hidden off-screen */
      background: #ffffff;
      color: #000000;
      width: 370px;
      padding: 16px 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.85);
      z-index: 9999;
      display: flex;
      align-items: center;
      gap: 15px;
      border-radius: 2px;
      transition: left 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .notif-icon {
      background: #003791;
      color: white;
      font-weight: bold;
      font-size: 18px;
      width: 44px;
      height: 44px;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
      border-radius: 2px;
    }
    .notif-text h3 {
      margin: 0 0 3px 0;
      font-size: 15px;
      color: #111111;
      font-weight: bold;
    }
    .notif-text p {
      margin: 0;
      font-size: 13px;
      color: #555555;
    }
  </style>
</head>
<body>
  <div class="overlay"></div>

  <!-- GoldHEN System Style Notification -->
  <div id="ps4-notification">
    <div class="notif-icon">PS</div>
    <div class="notif-text">
      <h3 id="notif-title">GoldHEN MS Boost</h3>
      <p id="notif-desc">Void Keep-Alive Active</p>
    </div>
  </div>

  <div class="content">
    <h1>PSBox Cloud Gaming</h1>
    <p id="status-text">Void Network Stabilizer Ready</p>
    <button class="boost-btn" id="xBtn" onclick="runStrongBoost()">Press X to Load MS Boost</button>
  </div>

  <script>
    var keepAliveInterval = null;

    window.onload = function() {
      document.getElementById("xBtn").focus();
    };

    function runStrongBoost() {
      var btn = document.getElementById("xBtn");
      var status = document.getElementById("status-text");
      var notif = document.getElementById("ps4-notification");
      var title = document.getElementById("notif-title");
      var desc = document.getElementById("notif-desc");

      btn.innerText = "Locking Packet Buffers...";
      status.innerText = "Purging memory congestion & locking socket route...";

      // Continuous Keep-Alive loop to prevent network packet drops
      if (!keepAliveInterval) {
        keepAliveInterval = setInterval(function() {
          fetch('https://www.cloudflare.com/cdn-cgi/trace', { mode: 'no-cors', cache: 'no-store' }).catch(function(){});
        }, 3000);
      }

      setTimeout(function() {
        title.innerText = "GoldHEN MS Boost Loaded";
        desc.innerText = "PSBox Cloud Locked ~30ms • Zero Drop Active";

        // Slide GoldHEN notification out from the left
        notif.style.left = "20px";

        btn.innerText = "Void Boost Active";
        status.innerText = "Latency locked • Packet drops blocked!";

        // Keep notification visible for 4 seconds, then slide away safely without redirecting
        setTimeout(function() {
          notif.style.left = "-450px";
        }, 4000);
      }, 800);
    }
  </script>
</body>
</html>
