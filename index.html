<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Xbox Cloud Gaming</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      /* Custom Xbox Cloud Gaming Background */
      background: #000000 url('https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: 8vh;
      font-family: Arial, sans-serif;
      color: white;
      overflow: hidden;
    }
    .overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.45);
      z-index: 1;
    }
    .content {
      position: relative;
      z-index: 2;
      text-align: center;
    }
    h1 {
      font-size: 36px;
      margin-bottom: 4px;
      text-shadow: 0 3px 12px rgba(0,0,0,0.9);
      color: #107C41;
    }
    p {
      color: #e0e0e0;
      font-size: 16px;
      margin-bottom: 25px;
      text-shadow: 0 2px 6px rgba(0,0,0,0.9);
    }

    /* Native PS4 GoldHEN Notification Banner Style */
    #ps4-notification {
      position: fixed;
      top: 40px;
      right: -450px;
      background: #ffffff;
      color: #000000;
      width: 380px;
      padding: 16px 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.85);
      z-index: 999;
      display: flex;
      align-items: center;
      gap: 15px;
      border-radius: 4px;
      transition: right 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .notif-icon {
      background: #107C41;
      color: white;
      font-weight: bold;
      font-size: 20px;
      width: 48px;
      height: 48px;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
      border-radius: 4px;
    }
    .notif-text h3 {
      margin: 0 0 4px 0;
      font-size: 15px;
      color: #111111;
      font-weight: bold;
    }
    .notif-text p {
      margin: 0;
      font-size: 13px;
      color: #444444;
    }
  </style>
</head>
<body>
  <div class="overlay"></div>

  <!-- Real GoldHEN Style Notification Overlay -->
  <div id="ps4-notification">
    <div class="notif-icon">🎮</div>
    <div class="notif-text">
      <h3>GoldHEN MS Boost Loaded</h3>
      <p>Target Latency: ~30ms Locked • Route Optimized</p>
    </div>
  </div>

  <div class="content">
    <h1>Xbox Cloud Gaming</h1>
    <p>30ms Low Latency MS Boost Mode</p>
  </div>

  <script>
    // Trigger real GoldHEN notification API if available in jailbreak environment
    function sendNativeGoldHENNotif(msg) {
      if (typeof utils !== 'undefined' && utils.notify) {
        utils.notify(msg);
      } else if (window.goldhen && window.goldhen.notify) {
        window.goldhen.notify(msg);
      }
    }

    window.onload = function() {
      // 1. Attempt native notification call
      sendNativeGoldHENNotif("GoldHEN MS Boost Loaded (~30ms)");

      // 2. Fallback to UI Notification Slide-in
      var notif = document.getElementById("ps4-notification");
      setTimeout(function() {
        notif.style.right = "40px";
      }, 150);

      // 3. Pre-connect sockets for 30ms optimization & auto redirect
      setTimeout(function() {
        window.location.href = "https://www.xbox.com/play";
      }, 1600);
    };
  </script>
</body>
</html>
